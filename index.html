<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no"/>
    <meta name="theme-color" content="#ffffff">
    <title>Трекер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section id="calendar-page" class="width-500">
    <div id="calendar"></div>
    <h3 id="chosen-day" class="accent center"></h3>
    <div id="chosen-records"></div>
</section>

<section id="stats-page" class="width-500 pad-20 hidden">
    <div id="period">
        <div></div>
        <button class="active" data-i="0">Неделя</button>
        <button data-i="1">Месяц</button>
        <button data-i="2">Год</button>
    </div>

    <div id="range">
        <button type="button" data-add="-1" aria-label="Предыдущий период">
            <svg>
                <use href="sprite.svg#prev"></use>
            </svg>
        </button>
        <span id="range-label"></span>
        <button type="button" data-add="1" aria-label="Следующий период">
            <svg>
                <use href="sprite.svg#next"></use>
            </svg>
        </button>
    </div>

    <div class="card">
        <h3>Теги</h3>
        <br/>
        <div class="h-list" id="tags-list"></div>
    </div>

    <div class="card">
        <h3>Цвет</h3>
        <br/>
        <div class="h-list" id="color-list"></div>
    </div>

    <div class="card">
        <h3>Форма</h3>
        <br/>
        <div class="h-list" id="form-list"></div>
    </div>

    <div class="card" style="--color: var(--yellow)">
        <h3 class="row gap-8"><span>Бристоль</span><span class="gray">—</span><span class="gray"></span></h3>
        <br/>
        <div class="v-chart" id="bristol-chart"></div>
    </div>

    <div class="card">
        <h3 class="row gap-8"><span>Количество</span><span class="gray">—</span><span class="gray"></span></h3>
        <br/>
        <div class="v-chart" id="count-chart"></div>
    </div>

    <div class="card" style="--color: var(--yellow)">
        <h3 class="row gap-8"><span>Объем</span><span class="gray">—</span><span class="gray"></span></h3>
        <br/>
        <div class="v-chart" id="volume-chart"></div>
    </div>
</section>

<section id="settings-page" class="width-500 pad-20 hidden col">
    <a href="https://www.tbank.ru/cf/3sEawgoGUDe" target="_blank"
       class="row gap-10 pad-10" data-i18n="support">
        <svg class="icon">
            <use href="sprite.svg#heart"></use>
        </svg>
        <span>Сказать спасибо</span>
    </a>

    <a class="row gap-10 pad-10" href="mailto:yuzhakov.gleb@gmail.com?subject=PoopTracker">
        <svg class="icon">
            <use href="sprite.svg#chat"></use>
        </svg>
        <span data-i18n="mailTo">Написать нам</span>
    </a>

    <a href="https://yugle7.github.io/poop-tracker/privacy.html" target="_blank"
       class="row gap-10 pad-10">
        <svg class="icon">
            <use href="sprite.svg#shield"></use>
        </svg>
        <span>Политика конфиденциальности</span>
    </a>

    <button id="reset" class="left row gap-10 pad-10">
        <svg class="icon">
            <use href="sprite.svg#reset"></use>
        </svg>
        <span>Сбросить данные</span>
    </button>
</section>

<div class="hidden">
    <div id="calendars"></div>
</div>

<nav aria-label="Основная навигация">
    <div id="nav">
        <button data-page="calendar" class="to active" aria-label="Календарь" aria-selected="true">
            <svg>
                <use href="sprite.svg#calendar"></use>
            </svg>
        </button>
        <button data-page="record" class="to" aria-label="Запись">
            <svg>
                <use href="sprite.svg#plus"></use>
            </svg>
        </button>
        <button data-page="stats" class="to" aria-label="Статистика">
            <svg>
                <use href="sprite.svg#stats"></use>
            </svg>
        </button>
        <button data-page="settings" class="to" aria-label="Добавить">
            <svg>
                <use href="sprite.svg#settings"></use>
            </svg>
        </button>
    </div>
</nav>

<section id="record-page" class="over hidden">
    <header class="row">
        <button id="to-calendar" class="icon" aria-label="Назад">
            <svg>
                <use href="sprite.svg#close"></use>
            </svg>
        </button>
        <button id="pooped-date" class="tap" aria-haspopup="dialog" aria-label="Выбрать дату"></button>
        <button id="pooped-time" class="tap" aria-haspopup="dialog" aria-label="Выбрать время"></button>
        <button class="green right" id="approve">Создать</button>
    </header>

    <div class="scroll">
        <div class="width-500 col gap-30 pad-20">
            <section>
                <div id="bristol-label"></div>
                <br>
                <div id="bristol-icons" class="row" role="radiogroup" aria-label="Форма по Бристольской шкале"></div>
            </section>

            <section>
                <div id="color-label"></div>
                <br>
                <div id="color-icons" class="color-grid" role="radiogroup" aria-label="Цвет"></div>
            </section>

            <section id="volume">
                <div id="volume-label"></div>
                <br/>
                <span id="volume-value" class="gray small"></span>
                <input id="volume-range" type="range" min="0" max="99" step="1" aria-label="Объем от 1 до 5">
            </section>

            <section>
                <div class="row add">
                    <h3>Теги</h3>
                    <button id="edit-tags" class="right">
                        <svg>
                            <use href="sprite.svg#add"></use>
                        </svg>
                    </button>
                </div>
                <br>
                <div id="tag-buttons"></div>
            </section>
            <button class="red" id="reject">Отменить</button>
        </div>
    </div>

    <div id="overlay"></div>

    <div id="tags-editor">
        <div class="row">
            <input id="tag" type="text" maxlength="24" placeholder="Новый тег"
                   aria-label="Название собственного тега">
            <button id="create-tag" class="right">Добавить</button>
        </div>
        <div id="tag-actions"></div>
        <footer>
            <button id="close-tags" class="right">Отмена</button>
            <button id="apply-tags" class="accent">Ok</button>
        </footer>
    </div>

    <div id="when-picker">
        <div id="watch">
            <button id="day" class="tap"></button>
            <button id="hour" class="tap"></button>
            <svg id="colon" viewBox="0 0 6 24" width="6" height="24">
                <circle cx="3" cy="8" r="1" stroke="var(--text)" fill="none"/>
                <circle cx="3" cy="16" r="1" stroke="var(--text)" fill="none"/>
            </svg>
            <button id="minute" class="tap"></button>
        </div>

        <div id="clock">
            <div id="white"></div>
            <div id="black"></div>
            <div id="center"></div>
            <div id="line"></div>
            <div id="hand"></div>
        </div>

        <div id="when-calendar">
            <div class="days">
                <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
            </div>
            <div class="days" id="when-days"></div>
        </div>

        <footer>
            <button id="when-prev">
                <svg>
                    <use href="sprite.svg#prev"></use>
                </svg>
            </button>
            <span id="when-month"></span>
            <button id="when-next">
                <svg>
                    <use href="sprite.svg#next"></use>
                </svg>
            </button>
            <button id="close-when" class="right">Отмена</button>
            <button id="apply-when" class="accent">Ok</button>
        </footer>
    </div>
</section>

<script src="script.js"></script>

<script>
    if (navigator.serviceWorker) {
        navigator.serviceWorker
            .register("/poop-tracker/sw.js", {
                scope: "/poop-tracker/",
                updateViaCache: "none"
            })
            .then((reg) => {
                reg.update();

                if (reg.waiting) {
                    reg.waiting.postMessage("skipWaiting");
                }

                navigator.serviceWorker.addEventListener(
                    "controllerchange",
                    () => {
                        window.location.reload();
                    }
                );
            });
    }
</script>

</body>
</html>
